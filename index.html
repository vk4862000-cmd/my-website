<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Store - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            🛍️ My Store
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                onkeyup="searchProducts()"
            >
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

        <button class="login-button" onclick="openAuth()">
            👤 Sign In
        </button>

    </header>


    <!-- NAVIGATION -->
    <nav>

        <button onclick="filterProducts('all')">
            All
        </button>

        <button onclick="filterProducts('electronics')">
            Electronics
        </button>

        <button onclick="filterProducts('clothing')">
            Clothing
        </button>

        <button onclick="filterProducts('accessories')">
            Accessories
        </button>

    </nav>


    <!-- HERO -->
    <section class="hero">

        <div>

            <h1>
                Welcome to My Store
            </h1>

            <p>
                Find the best products at the best prices.
            </p>

            <button onclick="scrollToProducts()">
                Shop Now
            </button>

        </div>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section">

        <h2>
            Our Products
        </h2>

        <div
            id="productContainer"
            class="product-container"
        >

            <!-- Products JavaScript se aayenge -->

        </div>

    </section>


    <!-- CART SIDEBAR -->
    <div
        id="cartSidebar"
        class="cart-sidebar"
    >

        <div class="cart-header">

            <h2>
                🛒 Your Cart
            </h2>

            <button onclick="closeCart()">
                ✕
            </button>

        </div>


        <div id="cartItems">

            <p>
                Your cart is empty.
            </p>

        </div>


        <div class="cart-total">

            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button
                class="checkout-btn"
                onclick="openCheckout()"
            >
                Checkout
            </button>

        </div>

    </div>


    <!-- CHECKOUT MODAL -->
    <div
        id="checkoutModal"
        class="modal"
    >

        <div class="checkout-box">

            <button
                class="close-modal"
                onclick="closeCheckout()"
            >
                ✕
            </button>

            <h2>
                Checkout
            </h2>

            <input
                type="text"
                id="customerName"
                placeholder="Full Name"
            >

            <input
                type="tel"
                id="customerPhone"
                placeholder="Phone Number"
            >

            <textarea
                id="customerAddress"
                placeholder="Delivery Address"
            ></textarea>

            <button
                class="order-btn"
                onclick="placeOrder()"
            >
                Place Order
            </button>

        </div>

    </div>


    <!-- LOGIN MODAL -->
    <div
        id="authModal"
        class="modal"
    >

        <div class="checkout-box">

            <button
                class="close-modal"
                onclick="closeAuth()"
            >
                ✕
            </button>

            <h2>
                👤 My Account
            </h2>


            <!-- SIGN UP -->

            <h3>
                Create Account
            </h3>

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >

            <button
                class="order-btn"
                onclick="signup()"
            >
                Sign Up
            </button>


            <hr>


            <!-- LOGIN -->

            <h3>
                Login
            </h3>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                class="order-btn"
                onclick="login()"
            >
                Login
            </button>


            <!-- GOOGLE -->

            <button
                class="google-login"
                onclick="googleLogin()"
            >
                🔵 Continue with Google
            </button>


            <!-- LOGOUT -->

            <button
                class="logout-button"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 My Store. All Rights Reserved.
        </p>

    </footer>


    <!-- FIREBASE -->
    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import { getAuth }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyBJLDffmy4rl_Umb7fdlqMVfCzQnbORdVk",

            authDomain:
                "mystore-2f465.firebaseapp.com",

            projectId:
                "mystore-2f465",

            storageBucket:
                "mystore-2f465.firebasestorage.app",

            messagingSenderId:
                "255687755598",

            appId:
                "1:255687755598:web:3ec262c976672082bc801f",

            measurementId:
                "G-4HZN3YFPLY"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        window.firebaseApp =
            app;

        window.firebaseAuth =
            auth;

    </script>


    <!-- JAVASCRIPT -->
  <script src="script.js"></script>


</body>

</html>
