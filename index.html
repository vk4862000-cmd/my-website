<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Store - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            🛒 MyStore
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

    </header>


    <!-- NAVBAR -->
    <nav>

        <button onclick="filterProducts('all')">
            All
        </button>

        <button onclick="filterProducts('electronics')">
            Electronics
        </button>

        <button onclick="filterProducts('clothing')">
            Clothing
        </button>

        <button onclick="filterProducts('accessories')">
            Accessories
        </button>

    </nav>


    <!-- HERO SECTION -->
    <section class="hero">

        <div>
            <h1>Welcome to MyStore</h1>

            <p>
                Quality Products at Best Prices
            </p>

            <button onclick="scrollToProducts()">
                Shop Now
            </button>
        </div>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <div id="productContainer" class="product-container">

        </div>

    </section>


    <!-- CART SIDEBAR -->
    <div id="cartSidebar" class="cart-sidebar">

        <div class="cart-header">

            <h2>Your Cart</h2>

            <button onclick="closeCart()">
                ✕
            </button>

        </div>


        <div id="cartItems">

        </div>


        <div class="cart-total">

            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button
                class="checkout-btn"
                onclick="openCheckout()"
            >
                Checkout
            </button>

        </div>

    </div>


    <!-- CHECKOUT -->
    <div id="checkoutModal" class="modal">

        <div class="checkout-box">

            <button
                class="close-modal"
                onclick="closeCheckout()"
            >
                ✕
            </button>

            <h2>Customer Details</h2>

            <input
                type="text"
                id="customerName"
                placeholder="Your Name"
            >

            <input
                type="tel"
                id="customerPhone"
                placeholder="Phone Number"
            >

            <textarea
                id="customerAddress"
                placeholder="Delivery Address"
            ></textarea>

            <button
                class="order-btn"
                onclick="placeOrder()"
            >
                Place Order on WhatsApp
            </button>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>

        <h3>MyStore</h3>

        <p>
            © 2026 MyStore. All Rights Reserved.
        </p>

        <p>
            Contact: +91 XXXXXXXXXX
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
